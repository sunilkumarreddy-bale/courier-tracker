name: JDBC and JFLAP checks
on:
  push:
    paths: ['jdbc-jflap/**', '.github/workflows/jdbc-jflap.yml']
  pull_request:
    paths: ['jdbc-jflap/**', '.github/workflows/jdbc-jflap.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: courier_jflap
          MYSQL_USER: courier
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s --health-timeout=5s --health-retries=30
    defaults:
      run:
        working-directory: jdbc-jflap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B test-compile dependency:copy-dependencies
      - run: java -cp 'target/test-classes:target/classes:target/dependency/*' com.courier.jdbc.Checks --database
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/courier_jflap?connectionTimeZone=UTC&allowPublicKeyRetrieval=true&sslMode=DISABLED
          DB_USER: courier
          DB_PASSWORD: ci-only-password
